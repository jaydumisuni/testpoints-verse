name: Finish test-point image collection

on:
  push:
    branches: [main]
    paths:
      - scripts/import_xiaomi_webp_zip.py
      - scripts/recover_xiaomi_pdf_images.py
      - scripts/recover_xiaomi_pdf_unar.py
      - scripts/recover_sigma_small_images.py
      - .github/workflows/finish-image-collection.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-testpoint-collection
  cancel-in-progress: true

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow pymupdf gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar

      - name: Configure commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify remaining Sigma Huawei images
        run: |
          set +e
          python scripts/recover_sigma_small_images.py
          status=$?
          git add test-points/huawei collection-report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Recover remaining Sigma Huawei test-point images"
            git push origin main
          fi
          echo "Sigma verification exit: $status"

      - name: Recover Xiaomi PDF images with fallbacks
        run: |
          set +e
          : > /tmp/xiaomi-recovery.log
          python scripts/import_xiaomi_webp_zip.py >> /tmp/xiaomi-recovery.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Drive import failed; trying MediaFire with unar." >> /tmp/xiaomi-recovery.log
            python scripts/recover_xiaomi_pdf_unar.py >> /tmp/xiaomi-recovery.log 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "unar failed; trying MediaFire with 7z." >> /tmp/xiaomi-recovery.log
            python scripts/recover_xiaomi_pdf_images.py >> /tmp/xiaomi-recovery.log 2>&1
            status=$?
          fi
          cat /tmp/xiaomi-recovery.log
          git add test-points/sumatech/xiaomi collection-report.json 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            cp /tmp/xiaomi-recovery.log xiaomi-recovery.log
            git add xiaomi-recovery.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Recover Xiaomi PDF test-point images"
            git push origin main
          fi
          echo "Xiaomi recovery exit: $status"

      - name: Remove completed collection tooling
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('collection-report.json').read_text('utf-8'))
          sources = report.get('sources', {})
          sigma = sources.get('sigmakey-huawei', {})
          suma = sources.get('sumatech', {})
          droid = sources.get('droidwin', {})
          unlock = sources.get('unlocktool-edl', {})
          complete = (
              sigma.get('status') == 'success'
              and sigma.get('saved', 0) >= 169
              and suma.get('status') == 'success'
              and suma.get('saved', 0) >= 162
              and droid.get('status') == 'success'
              and unlock.get('status') == 'success'
          )
          raise SystemExit(0 if complete else 1)
          PY
          then
            rm -f \
              .github/workflows/collect-remaining-images.yml \
              .github/workflows/finish-image-collection.yml \
              scripts/oracle_unlocktool_collect.py \
              scripts/droidwin_recover.py \
              scripts/sumatech_recover.py \
              scripts/sumatech_recover_v2.py \
              scripts/recover_xiaomi_pdf_images.py \
              scripts/recover_xiaomi_pdf_unar.py \
              scripts/recover_sigma_small_images.py \
              scripts/import_xiaomi_webp_zip.py \
              xiaomi-recovery.log
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Remove completed image collection tooling"
              git push origin main
            fi
          else
            echo "Collection is not fully proven; retaining tooling for correction."
          fi
