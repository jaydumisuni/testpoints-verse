name: Collect remaining test-point images

on:
  push:
    branches: [main]
    paths:
      - scripts/oracle_unlocktool_collect.py
      - .github/workflows/collect-remaining-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-remaining-testpoints
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and image tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar

      - name: Configure commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect UnlockTool only when incomplete
        env:
          SOURCE: unlocktool
        run: |
          set +e
          if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('collection-report.json').read_text('utf-8'))
          item = data.get('sources', {}).get('unlocktool-edl', {})
          raise SystemExit(0 if item.get('status') == 'success' and item.get('discovered_posts', 0) >= 595 else 1)
          PY
          then
            echo "UnlockTool already complete; skipping recrawl."
          else
            python scripts/oracle_unlocktool_collect.py
          fi
          status=$?
          git add collection-report.json 2>/dev/null || true
          git add test-points/unlocktool 2>/dev/null || true
          git add isp-pinouts/ufs/unlocktool isp-pinouts/emmc/unlocktool isp-pinouts/unclassified/unlocktool 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Collect complete UnlockTool test-point catalogue"
            git push origin main
          fi
          echo "UnlockTool collector exit: $status"

      - name: Enable DroidWin WordPress fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/oracle_unlocktool_collect.py')
          source = path.read_text('utf-8')
          old = '''        finally:
            await context.close()
            await browser.close()

    for image_url, title in list(dict.fromkeys(items)):
'''
          new = '''        finally:
            await context.close()
            await browser.close()

    if not items:
        slug = "how-to-access-edl-test-point-on-various-android-devices"
        endpoints = [
            f"https://droidwin.com/wp-json/wp/v2/posts?slug={slug}&per_page=1",
            f"https://droidwin.com/?rest_route=/wp/v2/posts&slug={slug}&per_page=1",
        ]
        for endpoint in endpoints:
            try:
                response = fetch(endpoint)
                payload = response.json()
                if not isinstance(payload, list) or not payload:
                    continue
                rendered = payload[0].get("content", {}).get("rendered", "")
                soup = BeautifulSoup(rendered, "html.parser")
                current = "android-device"
                for node in soup.find_all(["h2", "h3", "h4", "img"]):
                    if node.name in {"h2", "h3", "h4"}:
                        heading = node.get_text(" ", strip=True)
                        if heading:
                            current = heading
                        continue
                    raw = node.get("data-lazy-src") or node.get("data-src") or node.get("src")
                    alt = node.get("alt") or current
                    if not raw or re.search(r"logo|avatar|icon|banner|advert|driver|cable", f"{raw} {alt}", re.I):
                        continue
                    if re.search(r"test[ -]?point|edl", f"{alt} {current}", re.I):
                        items.append((urljoin(url, raw), current if "test point" in current.lower() else alt))
                if items:
                    notes.append(f"wordpress-api recovered {len(items)} image references")
                    break
            except Exception as exc:
                notes.append(f"wordpress-api: {type(exc).__name__}: {exc}")

    for image_url, title in list(dict.fromkeys(items)):
