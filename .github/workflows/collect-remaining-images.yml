name: Collect remaining test-point images

on:
  push:
    branches: [main]
    paths:
      - scripts/oracle_unlocktool_collect.py
      - .github/workflows/collect-remaining-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-remaining-testpoints
  cancel-in-progress: false

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and image tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar

      - name: Configure commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect UnlockTool only when incomplete
        env:
          SOURCE: unlocktool
        run: |
          set +e
          if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('collection-report.json').read_text('utf-8'))
          item = data.get('sources', {}).get('unlocktool-edl', {})
          raise SystemExit(0 if item.get('status') == 'success' and item.get('discovered_posts', 0) >= 595 else 1)
          PY
          then
            echo "UnlockTool already complete; skipping recrawl."
          else
            python scripts/oracle_unlocktool_collect.py
          fi
          status=$?
          git add collection-report.json 2>/dev/null || true
          git add test-points/unlocktool 2>/dev/null || true
          git add isp-pinouts/ufs/unlocktool isp-pinouts/emmc/unlocktool isp-pinouts/unclassified/unlocktool 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Collect complete UnlockTool test-point catalogue"
            git push origin main
          fi
          echo "UnlockTool collector exit: $status"

      - name: Collect DroidWin through rendered browser
        env:
          SOURCE: droidwin
        run: |
          set +e
          python scripts/oracle_unlocktool_collect.py
          status=$?
          git add collection-report.json 2>/dev/null || true
          git add test-points/droidwin 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Collect DroidWin rendered test-point images"
            git push origin main
          fi
          echo "DroidWin collector exit: $status"

      - name: Enable SumaTech password-protected archives
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/oracle_unlocktool_collect.py')
          source = path.read_text('utf-8')
          old = '''                        proc = subprocess.run([sevenzip, "x", "-y", f"-o{out}", str(archive)], capture_output=True, text=True, timeout=180)
                        if proc.returncode != 0:
                            raise RuntimeError(f"archive extraction failed: {proc.stderr[-300:]}")
'''
          new = '''                        extraction_attempts = [
                            [sevenzip, "x", "-y", "-pwww.sumatechsolution.com", f"-o{out}", str(archive)],
                            [sevenzip, "x", "-y", f"-o{out}", str(archive)],
                        ]
                        extraction_errors = []
                        extracted = False
                        for command in extraction_attempts:
                            shutil.rmtree(out, ignore_errors=True)
                            out.mkdir()
                            proc = subprocess.run(command, capture_output=True, text=True, timeout=180)
                            if proc.returncode == 0:
                                extracted = True
                                break
                            extraction_errors.append((proc.stderr or proc.stdout)[-300:])
                        if not extracted:
                            raise RuntimeError(f"archive extraction failed: {' | '.join(extraction_errors)}")
'''
          if old not in source:
              raise SystemExit('SumaTech extractor target not found')
          path.write_text(source.replace(old, new), 'utf-8')
          PY

      - name: Collect SumaTech through MediaFire browser flow
        env:
          SOURCE: sumatech
        run: |
          set +e
          python scripts/oracle_unlocktool_collect.py
          status=$?
          git restore scripts/oracle_unlocktool_collect.py
          git add collection-report.json 2>/dev/null || true
          git add test-points/sumatech 2>/dev/null || true
          git add isp-pinouts/ufs/sumatech isp-pinouts/emmc/sumatech isp-pinouts/unclassified/sumatech 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Collect SumaTech test-point packages"
            git push origin main
          fi
          echo "SumaTech collector exit: $status"
