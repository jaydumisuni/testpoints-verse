          if index_old not in source:
              raise SystemExit('SumaTech index target not found')
          source = source.replace(index_old, index_new)

          archive_old = '''                        proc = subprocess.run([sevenzip, "x", "-y", f"-o{out}", str(archive)], capture_output=True, text=True, timeout=180)
