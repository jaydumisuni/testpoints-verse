name: Collect remaining test-point images

on:
  push:
    branches: [main]
    paths:
      - scripts/droidwin_recover.py
      - scripts/sumatech_recover_v2.py
      - .github/workflows/collect-remaining-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-remaining-testpoints
  cancel-in-progress: true

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unar

      - name: Configure commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recover DroidWin test-point images
        run: |
          set +e
          python scripts/droidwin_recover.py
          status=$?
          git add collection-report.json 2>/dev/null || true
          git add test-points/droidwin 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Recover DroidWin test-point images"
            git push origin main
          fi
          echo "DroidWin recovery exit: $status"

      - name: Recover SumaTech packages
        run: |
          set +e
          python scripts/sumatech_recover_v2.py
          status=$?
          git add collection-report.json 2>/dev/null || true
          git add test-points/sumatech 2>/dev/null || true
          git add isp-pinouts/ufs/sumatech isp-pinouts/emmc/sumatech isp-pinouts/unclassified/sumatech 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Recover SumaTech test-point packages"
            git push origin main
          fi
          echo "SumaTech recovery exit: $status"
