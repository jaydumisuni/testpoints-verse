      - name: Collect SumaTech through MediaFire browser flow
        env:
          SOURCE: sumatech
        run: |
          set +e
          python scripts/oracle_unlocktool_collect.py
          status=$?
          git restore scripts/oracle_unlocktool_collect.py
          git add collection-report.json 2>/dev/null || true
          git add test-points/sumatech 2>/dev/null || true
          git add isp-pinouts/ufs/sumatech isp-pinouts/emmc/sumatech isp-pinouts/unclassified/sumatech 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Collect SumaTech test-point packages"
            git push origin main
          fi
          echo "SumaTech collector exit: $status"
