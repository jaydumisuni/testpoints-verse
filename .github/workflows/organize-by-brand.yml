name: Organize test-point archive by brand

on:
  push:
    branches: [main]
    paths:
      - scripts/organize_by_brand.py
      - .github/workflows/organize-by-brand.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-testpoints-by-brand
  cancel-in-progress: true

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install organizer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Organize, normalize, and deduplicate
        run: python scripts/organize_by_brand.py

      - name: Prove final repository invariants
        run: python scripts/organize_by_brand.py --verify-only

      - name: Commit organized archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.quotepath false
          git add -A
          if git diff --cached --quiet; then
            echo "No organization changes were required."
            exit 0
          fi
          git commit -m "Organize images by brand and remove duplicate copies"
          git push origin main
